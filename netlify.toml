# Netlify config. No build step — this is plain HTML/CSS/JS served as-is.
[build]
  publish = "."
  command = ""

# The service worker must never be cached by the CDN, or visitors get stuck on an
# old shell forever and never see a new deploy. It has to be re-fetched every time.
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# index.html is the shell that points at everything else — same reasoning.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The css/ and js/ files are safe to cache hard: the service worker versions them
# (CACHE = "tahir-bot-vN") and drops the old cache on activate.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
